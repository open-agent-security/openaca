name: Autofix

# Two-direction comment-bounce that closes the Codex/Claude review loop
# without human intervention:
#
#   1. Codex bot reviews a PR  ->  this workflow posts `@claude please
#      address...`  ->  claude.yml fires, claude reads the review, fixes
#      it, pushes commits, posts a "Claude finished" summary comment.
#
#   2. Any new commits land on a PR head (`pull_request: synchronize`) ->
#      this workflow posts `@codex review` -> Codex re-reviews HEAD. ONE
#      job covers every source of new commits — the claude bot's fixes, a
#      human / local-agent push, AND the auto-rebase force-push below —
#      because `synchronize` fires regardless of who pushed. (Codex
#      auto-reviews on PR open / draft->ready natively, but NOT on
#      subsequent pushes; without this, later commits land unreviewed.)
#
# The two bounces together produce: codex-flag -> claude-fix ->
# codex-rereview -> ... bounded by the claude-side iteration cap in
# bounce 1 (the cap counts claude runs, so push-driven re-reviews add
# entry points, not an unbounded cycle). Codex is silent when clean
# (thumbs reaction), so an unnecessary @codex review on a no-op SHA costs
# one cheap call with no PR noise.
#
# Authentication: comments are posted (and PR branches are rebased)
# using AUTOFIX_TRIGGER_PAT, NOT secrets.GITHUB_TOKEN. GitHub explicitly
# suppresses workflow runs triggered by events created with
# GITHUB_TOKEN (recursion guard) — so a comment posted under
# github-actions[bot] would be silently dropped before claude.yml ever
# fired, and a rebase pushed under GITHUB_TOKEN would not re-trigger
# CI / Codex on the rebased branch. The PAT is fine-grained, owned by
# a repo OWNER/MEMBER, with BOTH:
#   - `Pull requests: Read and write` — for `gh pr comment` (bounces 1
#     and 2) and `gh pr list` (bounce 0).
#   - `Contents: Read and write` — for `actions/checkout` to fetch and
#     `git push` from the rebase-stale-prs job. WITHOUT this, the job
#     fails at the `Checkout` step with `403: Write access to
#     repository not granted` — actions/checkout asks GitHub to verify
#     write permission upfront because the same token will push later.
# The resulting comments/pushes are authored by that user, which DOES
# trigger downstream workflows AND naturally passes claude.yml's
# OWNER/MEMBER/COLLABORATOR trust gate. The same PAT serves all three
# bounces — Codex's webhook listener watches @-mentions in PR comments
# regardless of author.
#
# If AUTOFIX_TRIGGER_PAT is unset, both `gh pr comment` paths fail
# with an auth error and the chain breaks; rebase-stale-prs detects
# the missing secret and skips with a workflow warning. Manual
# @claude triggers are unaffected.
#
# Workflow-injection safety: every user/bot-controlled input (PR number,
# comment body, review id) is read via env: and referenced as a shell
# variable. Comment bodies posted to the PR are hardcoded literals — no
# interpolation of untrusted input into shell.

on:
  pull_request_review:
    types: [submitted]
  issue_comment:
    # Bounce 3: claude declares which threads its push fixed -> a trusted job
    # resolves exactly those. The declaration is data, never code: the bot has
    # no credential and nothing executable, so the resolve happens here.
    #
    # `edited` is REQUIRED, not defensive. claude-code-action creates one
    # in-progress comment and edits it in place into the "Claude finished"
    # summary (same behaviour the iteration cap below relies on to count runs).
    # The declaration is in that summary, so it arrives on `edited`; the
    # `created` event fires on the placeholder, before the work exists. Verified
    # on real runs — every claude[bot] comment has updated_at minutes after
    # created_at. Subscribing to `created` alone means this job never fires.
    # Because `edited` can fire repeatedly, the job skips threads that are
    # already resolved rather than replying to them again.
    types: [created, edited]
  pull_request:
    # Bounce 2: new commits on a PR head -> request a Codex re-review.
    # `synchronize` fires for pushes from ANY author — claude bot fixes,
    # human / local-agent pushes, AND the auto-rebase force-push from
    # rebase-stale-prs. App-authored pushes (claude[bot]) are NOT the
    # workflow's GITHUB_TOKEN, so they are not recursion-suppressed and DO
    # fire this event (verified: CI runs on claude's pushed commits).
    types: [synchronize]
  push:
    # Bounce 0: main moved -> rebase open PRs that are now stale. Catches
    # both PR merges AND direct pushes to main (manual hotfixes, manual
    # main pushes). pull_request:closed+merged would miss the latter.
    branches: [main]

jobs:
  trigger-claude-via-comment:
    # Bounce 1: Codex review submitted -> @claude addresses it.
    if: github.event_name == 'pull_request_review' && github.event.review.user.login == 'chatgpt-codex-connector[bot]' && github.event.review.state == 'commented'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.AUTOFIX_TRIGGER_PAT }}
      REPO: ${{ github.repository }}
      PR_NUM: ${{ github.event.pull_request.number }}
      REVIEW_ID: ${{ github.event.review.id }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      # Cap the auto-address loop at 7 claude runs per PR. If claude has
      # already run 7+ times and Codex is still finding issues, the loop
      # isn't converging — force human attention rather than burn cycles.
      #
      # Default was 3 originally; bumped to 7 because legitimate Codex
      # reviews on substantive PRs routinely surface 5-6 rounds of real
      # findings (defensive type guards across sibling files, CLI-flag
      # table extensions, OSV event-window edge cases). 3 was capping
      # real review work, not just runaway loops; 7 keeps the safety
      # net while accommodating multi-round legitimate review. Adjust
      # MAX below if your project's review patterns differ.
      #
      # Count claude-code-action runs by counting top-level PR comments
      # authored by the bot (the action posts ONE in-progress comment
      # per run and edits it in place to the "Claude finished..." summary
      # — 1 comment == 1 run). More accurate than counting bot commits:
      # a run that lands 0 commits (no-op fix or pre-push failure) and a
      # run that lands N commits both equal one iteration of the loop.
      #
      # Login string is "claude" — NOT "claude[bot]" — because
      # `gh pr view --json comments` uses GraphQL, and GraphQL's
      # `author.login` returns the bare bot name without the `[bot]`
      # suffix. The `[bot]` suffix only appears in REST surfaces (e.g.
      # `github.event.comment.user.login` at bounce-2 below). Same bot,
      # two string representations depending on which API you read.
      - name: Cap auto-address iterations (max 7)
        run: |
          MAX=7
          CLAUDE_RUNS=$(gh pr view "$PR_NUM" -R "$REPO" --json comments \
            --jq '[.comments[] | select(.author.login == "claude")] | length')
          if [ "$CLAUDE_RUNS" -ge "$MAX" ]; then
            gh pr comment "$PR_NUM" -R "$REPO" --body "🛑 Auto-address loop limit hit — claude has already run $CLAUDE_RUNS times on this PR (max $MAX). Codex review id $REVIEW_ID was NOT auto-addressed. Manual review needed; re-tag claude explicitly after addressing the underlying issue if you want to continue. ([workflow run]($RUN_URL))"
            echo "::error::Auto-address loop limit hit ($CLAUDE_RUNS/$MAX) — see PR comment."
            exit 1
          fi
          echo "Auto-address iteration $((CLAUDE_RUNS + 1)) of $MAX"

      # Post the @claude trigger. The body intentionally references "the
      # Codex review above" — claude-code-action's default prompt
      # construction will include the full review thread so the bot has
      # the actual findings + line context to act on.
      #
      # No HEAD-SHA marker is needed here: bounce 2 is now driven by
      # `pull_request: synchronize` (a real push), so "claude finished
      # without pushing" simply produces no synchronize and no re-review —
      # the old comment-driven no-push detection it required is gone.
      # The thread inventory is built HERE, not by the bot. Thread ids are the
      # only thing the bot needs to name what it fixed, and handing them over
      # as text keeps it from needing any API access of its own. Built with
      # --body-file so nothing in the review text is ever interpolated into a
      # shell command.
      - name: Post @claude trigger comment
        run: |
          cat > /tmp/trigger.md <<'PREAMBLE'
          @claude please address the Codex review feedback above. CRITICAL: before applying any fix that depends on infrastructure or invariants you have not verified (DLQ, schema, contracts, ADRs in docs/adrs/), grep the repo for the prerequisite. If it is not present, push back via a PR comment explaining the missing context rather than implementing on a false premise.

          After you have pushed your fixes, declare which threads the push actually closed. Post a PR comment whose last lines are, one per thread:

          ```
          RESOLVED | <thread-id> | <fix commit SHA> | <one line on what changed>
          ```

          A trusted workflow job reads those lines, replies on each thread, and resolves it. You cannot resolve a thread yourself and hold no token to do it with — declaring is the whole interface. Declare a thread ONLY when a change in this push addresses it: never because you disagree with it, never when you pushed back instead of fixing, and never in bulk. Every thread you leave undeclared stays open, which is correct — the unresolved list is how convergence gets measured, so a wrongly resolved thread costs more than one left open. If you fixed nothing, declare nothing.

          Unresolved threads on this PR:

          PREAMBLE
          gh api graphql -f query='
            query($o:String!,$n:String!,$p:Int!,$endCursor:String){
              repository(owner:$o,name:$n){pullRequest(number:$p){
                reviewThreads(first:100,after:$endCursor){
                  pageInfo{hasNextPage endCursor}
                  nodes{id isResolved path line comments(first:1){nodes{body}}}}}}}' \
            -f o="${REPO%%/*}" -f n="${REPO##*/}" -F p="$PR_NUM" --paginate \
            --jq '.data.repository.pullRequest.reviewThreads.nodes[]
                  | select(.isResolved == false)
                  | "- `" + .id + "` " + (.path // "-") + ":" + ((.line // 0) | tostring)
                    + " — " + ((.comments.nodes[0].body // "") | gsub("[\\n\\r\\t]"; " ") | .[0:160])' \
            >> /tmp/trigger.md || echo "(thread inventory unavailable — ask for ids in a comment)" >> /tmp/trigger.md
          gh pr comment "$PR_NUM" -R "$REPO" --body-file /tmp/trigger.md

  # Bounce 3: claude declared which threads its push fixed -> resolve exactly
  # those, here, in a job the bot cannot reach.
  #
  # Why this job exists rather than a script the bot runs: an autofix run must
  # be able to write files in the checkout, so any repo-path command it is
  # allowed to invoke is a command it can first rewrite — and any credential in
  # its environment is one it can print into a public comment through the text
  # arguments it controls. Both were live holes in the earlier shape of this
  # feature. Here the bot holds no token and executes nothing privileged; it
  # emits text, and this job decides what that text is permitted to do.
  #
  # Trust gates, in order: the commenter must be the claude APP, the comment
  # must be on a pull request, the PR number comes from the event payload and
  # never from the comment body, and every declared thread id is checked for
  # membership on THAT PR before it is touched.
  #
  # The login must be `claude[bot]` exactly — the REST form that issue_comment
  # payloads carry. Do not also accept bare `claude`: that is the GraphQL
  # normalization of the same identity, and as a REST login it would name a
  # regular user account that anyone could register and then use to declare
  # threads resolved on any PR. A user login cannot contain `[`, so the bracket
  # form is the unspoofable one.
  resolve-declared-threads:
    if: |
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request != null &&
      github.event.comment.user.login == 'claude[bot]' &&
      contains(github.event.comment.body, 'RESOLVED |')
    runs-on: ubuntu-latest
    # The already-resolved check below is a read-then-write, so it only gives
    # idempotency against runs that do not overlap. Two `edited` deliveries in
    # quick succession would otherwise both snapshot a thread as unresolved and
    # both post a reply. Serializing per PR is what makes the snapshot mean
    # something; different PRs touch disjoint threads and may still run at once.
    #
    # `cancel-in-progress: false` is deliberate, not inherited: cancelling the
    # in-flight run would discard declarations it had not processed yet, and a
    # queued run costs nothing here.
    concurrency:
      group: resolve-declared-threads-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.AUTOFIX_TRIGGER_PAT }}
      REPO: ${{ github.repository }}
      PR_NUM: ${{ github.event.issue.number }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Resolve the declared threads
        run: |
          set -uo pipefail

          # Read declarations from EVERY claude comment on the PR, not just the
          # one that triggered this run. GitHub keeps at most one pending run per
          # concurrency group — "any existing pending job or workflow in the same
          # concurrency group will be canceled and the new queued job or workflow
          # will take its place" — so with three deliveries from distinct
          # comments the middle one is superseded and its declarations would
          # otherwise be lost for good. Reconciling the whole PR makes whichever
          # run survives converge everything, and re-reading old declarations is
          # free because resolved threads are skipped.
          #
          # REST, and `claude[bot]` exactly: on this surface the app login
          # carries the bracket suffix, so it cannot be confused with a user
          # account named `claude`. GraphQL normalizes both to `claude` and would
          # let such an account inject declarations here.
          if ! gh api "repos/$REPO/issues/$PR_NUM/comments" --paginate \
              --jq '.[] | select(.user.login == "claude[bot]") | .body' > /tmp/claim.txt; then
            echo "::error::could not read this PR's comments — nothing reconciled"
            exit 1
          fi
          echo "reconciling $(grep -c '^[[:space:]]*RESOLVED[[:space:]]*|' /tmp/claim.txt || true) declaration line(s) across all claude comments"

          # Thread id + resolved state for THIS PR, captured to a file first. A
          # `... | grep -q` membership test would let grep exit early, SIGPIPE
          # the paginating producer, and reject a thread that is genuinely on
          # the PR. `$endCursor` is the variable `gh api --paginate` advances;
          # with any other name `after:` stays null and the first page repeats
          # forever.
          gh api graphql -f query='
            query($o:String!,$n:String!,$p:Int!,$endCursor:String){
              repository(owner:$o,name:$n){pullRequest(number:$p){
                reviewThreads(first:100,after:$endCursor){
                  pageInfo{hasNextPage endCursor}
                  nodes{id isResolved}}}}}' \
            -f o="${REPO%%/*}" -f n="${REPO##*/}" -F p="$PR_NUM" --paginate \
            --jq '.data.repository.pullRequest.reviewThreads.nodes[]
                  | .id + "\t" + (.isResolved | tostring)' > /tmp/pr_threads.tsv
          echo "PR #$PR_NUM has $(wc -l < /tmp/pr_threads.tsv) threads"

          # The PR's own commits, so a declared SHA can be checked for
          # belonging to this PR rather than merely looking like a SHA. This
          # comes through the pull-request scope the job already holds — no
          # `contents: read` — and costs one call per run, not one per thread.
          # If it fails the file is empty, every declaration is rejected, and
          # the threads stay open, which is the safe direction.
          if ! gh api graphql -f query='
            query($o:String!,$n:String!,$p:Int!,$endCursor:String){
              repository(owner:$o,name:$n){pullRequest(number:$p){
                commits(first:100,after:$endCursor){
                  pageInfo{hasNextPage endCursor} nodes{commit{oid}}}}}}' \
            -f o="${REPO%%/*}" -f n="${REPO##*/}" -F p="$PR_NUM" --paginate \
            --jq '.data.repository.pullRequest.commits.nodes[].commit.oid' > /tmp/pr_commits.txt; then
            echo "::warning::could not list this PR's commits — every declaration will be rejected"
            : > /tmp/pr_commits.txt
          fi
          echo "PR #$PR_NUM has $(wc -l < /tmp/pr_commits.txt) commits"

          # The resolved-state snapshot above is read once, so it cannot catch a
          # thread declared twice within the SAME comment — the concurrency
          # group serializes runs, not lines. Threads handled in this run are
          # recorded here and skipped on a repeat.
          : > /tmp/handled.txt

          RESOLVED=0; REJECTED=0; SKIPPED=0; FAILED=0

          # "Retry on the next delivery" is not a plan: if the last `edited`
          # event is the one carrying the declaration, there is no next delivery
          # and the thread stays open behind an already-posted reply. Retry here,
          # bounded, and fail the step if anything is still outstanding so the
          # run goes red rather than exiting 0 on a broken promise.
          retry() {
            n=0
            until "$@"; do
              n=$((n + 1))
              [ "$n" -ge 3 ] && return 1
              sleep $((n * 3))
            done
            return 0
          }
          while IFS='|' read -r _kw tid sha note; do
            TID=$(printf '%s' "${tid:-}" | tr -d '[:space:]`')
            SHA=$(printf '%s' "${sha:-}" | tr -d '[:space:]`')
            NOTE=$(printf '%s' "${note:-}" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')

            case "$TID" in
              PRRT_[A-Za-z0-9_=-]*) ;;
              *) echo "::warning::skipping malformed thread id"; REJECTED=$((REJECTED+1)); continue ;;
            esac
            # Hex-only, 7..40 chars, with nothing trailing. A prefix glob
            # ending in `*` would accept `abc1234,` or seven hex characters
            # followed by arbitrary text, and the reply would then cite a commit
            # that does not exist while still resolving the thread — the SHA is
            # the audit anchor, so a well-formed-looking wrong one is the whole
            # problem.
            SHA=$(printf '%s' "$SHA" | tr 'A-Z' 'a-z')
            SHA_OK=1
            case "$SHA" in *[!0-9a-f]*) SHA_OK=0 ;; esac
            [ "${#SHA}" -ge 7 ] && [ "${#SHA}" -le 40 ] || SHA_OK=0
            if [ "$SHA_OK" -eq 0 ]; then
              echo "::warning::skipping $TID — declared SHA is not a commit id"; REJECTED=$((REJECTED+1)); continue
            fi
            # Well-formed is not enough: a valid-looking SHA from another branch
            # would make the reply cite unrelated work, which reads as
            # legitimate and is worse than an obvious 404. `index($0,s)==1`
            # anchors a prefix match without regex, so a short SHA matches its
            # full oid.
            if ! awk -v s="$SHA" 'index($0, s) == 1 { found = 1; exit } END { exit !found }' /tmp/pr_commits.txt; then
              echo "::warning::skipping $TID — declared SHA is not a commit on PR #$PR_NUM"; REJECTED=$((REJECTED+1)); continue
            fi
            # awk reads the file directly rather than through a pipe, so the
            # early exit cannot SIGPIPE a producer.
            if grep -qxF "$TID" /tmp/handled.txt; then
              echo "$TID already handled in this run — skipping"; SKIPPED=$((SKIPPED+1)); continue
            fi
            STATE=$(awk -F'\t' -v t="$TID" '$1 == t { print $2; exit }' /tmp/pr_threads.tsv)
            case "$STATE" in
              false) ;;
              true)
                # `edited` can fire more than once on the same comment. Replying
                # again would stack duplicate replies on a thread already closed.
                echo "$TID already resolved — skipping"; SKIPPED=$((SKIPPED+1)); continue ;;
              *)
                echo "::warning::skipping $TID — not a thread on PR #$PR_NUM"; REJECTED=$((REJECTED+1)); continue ;;
            esac

            # A brokered reply is authored by the PAT's identity, which
            # claude.yml trusts as OWNER/MEMBER/COLLABORATOR. Forwarding a
            # model-authored `@claude` (or `@codex`) verbatim would therefore be
            # a fresh trusted invocation of another bot, driven by whatever text
            # an injection put in the note. Stripping `@` outright is blunt and
            # total; backticks would not help, because the trust gate matches
            # the raw body and does not care about markdown.
            NOTE=$(printf '%s' "$NOTE" | tr -d '@')

            BODY="Addressed in \`$SHA\`. ${NOTE:-No detail declared.}

          <sub>Resolved by the autofix loop from claude's declaration. [Workflow run]($RUN_URL) · if this thread was closed without a real fix, reopen it — the declaration is the bot's claim, not a verification.</sub>"

            # ORDER MATTERS, and it is the whole duplicate-reply defence.
            #
            # `resolveReviewThread` is idempotent — resolving an already-resolved
            # thread succeeds with no visible change — so it is safe to retry.
            # `addPullRequestReviewThreadReply` is a create with no idempotency
            # key, so retrying it after a lost response posts the comment twice.
            #
            # Resolving first, then replying exactly once, makes every ordering
            # safe without bookkeeping: a redelivery finds the thread resolved
            # and skips it, so the reply cannot be duplicated; a reopened thread
            # is unresolved again and correctly gets a fresh reply naming the new
            # commit. That replaced a per-SHA marker, a marker snapshot, and a
            # reply retry — three mechanisms detecting a hazard that ordering
            # removes.
            #
            # The residual cost is honest: if the reply fails after the resolve
            # succeeded, the thread is closed without its note. The run goes red
            # below, so it is visible and a human can add it. Losing one note is
            # a better failure than silently posting three.
            if ! retry gh api graphql -f query='mutation($t:ID!){resolveReviewThread(input:{threadId:$t}){thread{isResolved}}}' \
                 -f t="$TID" --silent; then
              # An API failure is not a bad declaration. Counted apart so the
              # summary comment below does not blame the bot for a blip.
              echo "::warning::could not resolve $TID after retries"; FAILED=$((FAILED+1)); echo "$TID" >> /tmp/handled.txt
              continue
            fi
            echo "resolved $TID"; RESOLVED=$((RESOLVED+1)); echo "$TID" >> /tmp/handled.txt
            # Exactly one attempt, never retried. -f/--raw-field, never -F:
            # `-F` treats a leading @ as a filename and would read a local file
            # into a public reply.
            gh api graphql -f query='mutation($t:ID!,$b:String!){addPullRequestReviewThreadReply(input:{pullRequestReviewThreadId:$t,body:$b}){comment{url}}}' \
              -f t="$TID" -f b="$BODY" --silent \
              || echo "::warning::$TID resolved but its note could not be posted"
          done < <(grep '^[[:space:]]*RESOLVED[[:space:]]*|' /tmp/claim.txt)

          echo "resolved=$RESOLVED skipped=$SKIPPED rejected=$REJECTED failed=$FAILED"
          # Only speak up when the whole declaration failed. SKIPPED>0 means a
          # repeat `edited` firing over work already done, which is the normal
          # steady state — complaining there would post the same warning on
          # every edit of the summary comment.
          if [ "$RESOLVED" -eq 0 ] && [ "$SKIPPED" -eq 0 ] && [ "$FAILED" -eq 0 ] && [ "$REJECTED" -gt 0 ]; then
            gh pr comment "$PR_NUM" -R "$REPO" --body "⚠️ Every thread claude declared as fixed was rejected ($REJECTED). Nothing was resolved — see the [workflow run]($RUN_URL). The threads are still open, which is the safe outcome."
          fi
          if [ "$FAILED" -gt 0 ]; then
            gh pr comment "$PR_NUM" -R "$REPO" --body "⚠️ $FAILED declared thread(s) could not be closed after retries — see the [workflow run]($RUN_URL). They are still open; re-tag claude or close them by hand." || true
            echo "::error::$FAILED thread(s) left unresolved after retries"
            exit 1
          fi

  request-codex-rereview-on-push:
    # Bounce 2: new commits pushed to a PR head -> @codex re-reviews HEAD.
    # `pull_request: synchronize` fires on EVERY push to the PR head
    # regardless of author — the claude bot's fixes, a human / local-agent
    # push, AND the auto-rebase force-push from rebase-stale-prs — so this
    # single job covers all of them. Replaces the old issue_comment /
    # "Claude finished" trigger: claude-code-action commits via the Claude
    # GitHub App (author claude[bot]), and App-authored pushes fire
    # pull_request events (they are not the workflow's GITHUB_TOKEN, so not
    # recursion-suppressed). "Claude finished without pushing" needs no
    # special case now — no commits means no synchronize means no review.
    #
    # Same-repo only: GitHub withholds secrets from pull_request runs on
    # fork PRs, so AUTOFIX_TRIGGER_PAT would be empty and `gh pr comment`
    # would fail. Excluding forks here keeps fork PRs from producing red
    # runs (and claude.yml refuses fork PRs downstream anyway).
    if: >
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    concurrency:
      # Coalesce rapid pushes to one review of the final SHA. Without this,
      # 5 quick commits = 5 separate @codex reviews (each distinct SHA
      # dodges the per-SHA marker). cancel-in-progress keeps only the
      # latest push's job, which then reads the current HEAD.
      group: codex-rereview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      GH_TOKEN: ${{ secrets.AUTOFIX_TRIGGER_PAT }}
      REPO: ${{ github.repository }}
      PR_NUM: ${{ github.event.pull_request.number }}
    steps:
      # Per-SHA idempotency: skip if we already requested review for the
      # current HEAD. Guards a double-synchronize on the same SHA and any
      # overlap with a manual @codex review. Read live HEAD (not the event
      # SHA) so a coalesced burst reviews the latest commit.
      - name: Post @codex re-review trigger (idempotent per SHA)
        run: |
          HEAD_SHA=$(gh pr view "$PR_NUM" -R "$REPO" --json headRefOid --jq '.headRefOid')
          MARKER="<!-- autofix-rereview-sha:$HEAD_SHA -->"
          ALREADY=$(gh pr view "$PR_NUM" -R "$REPO" --json comments \
            --jq "[.comments[] | select(.body | contains(\"$MARKER\"))] | length")
          if [ "$ALREADY" -gt 0 ]; then
            echo "Already requested @codex review for $HEAD_SHA — skipping."
            exit 0
          fi
          gh pr comment "$PR_NUM" -R "$REPO" --body "$MARKER
          @codex review the latest commits pushed to this PR."

  rebase-stale-prs:
    # Bounce 0: main moved -> for each open PR (same-repo only, fork PRs
    # excluded), check mergeStateStatus and either rebase cleanly or ask
    # @claude to resolve conflicts. Catches both PR-merge pushes and
    # direct pushes to main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      # Coalesce: if main moves twice while we're still working on the
      # first push, cancel and re-run with the latest SHA. Avoids racing
      # two rebase runs against the same PR.
      group: rebase-stale-prs
      cancel-in-progress: true
    env:
      # Use the PAT for both gh API calls AND the git push. Pushing to a
      # PR branch under GITHUB_TOKEN works but invalidates downstream
      # workflow triggers (recursion guard) — the PAT keeps the @claude
      # comment path working if this rebase later races with a Codex
      # review on the same PR.
      GH_TOKEN: ${{ secrets.AUTOFIX_TRIGGER_PAT }}
      REPO: ${{ github.repository }}
      MAIN_SHA: ${{ github.sha }}
    steps:
      # Graceful skip when the PAT secret isn't configured yet (initial
      # repo setup). Without this guard, actions/checkout fails with
      # "Input required and not supplied: token" on every push to main,
      # turning every merge into a red workflow run during the window
      # between "workflows scaffolded" and "secrets configured."
      - id: have_pat
        name: Check AUTOFIX_TRIGGER_PAT presence
        env:
          PAT: ${{ secrets.AUTOFIX_TRIGGER_PAT }}
        run: |
          if [ -z "$PAT" ]; then
            echo "::warning::AUTOFIX_TRIGGER_PAT not set; skipping rebase. Add the secret per setup-autofix instructions to enable."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout (full history for rebase)
        if: steps.have_pat.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.AUTOFIX_TRIGGER_PAT }}

      - name: Configure git author
        if: steps.have_pat.outputs.skip != 'true'
        run: |
          git config user.email "actions@users.noreply.github.com"
          git config user.name "github-actions[bot]"

      - name: Rebase BEHIND PRs / flag DIRTY ones
        if: steps.have_pat.outputs.skip != 'true'
        run: |
          set -euo pipefail

          # mergeStateStatus values that matter:
          #   CLEAN     - up to date with main (or ahead). skip.
          #   BEHIND    - mergeable, base moved. clean rebase needed.
          #   DIRTY     - conflicts. ask @claude.
          #   BLOCKED   - branch protection or required checks failing. skip.
          #   UNSTABLE  - mergeable but failing checks. skip — pre-existing.
          #   UNKNOWN   - GitHub still computing. skip; next push retries.
          #
          # We exclude fork PRs: pushing to a fork branch from this workflow
          # 403s, and posting @claude on a fork is blocked downstream by
          # claude.yml's fork-refusal step anyway.
          PRS_JSON=$(gh pr list --state open -R "$REPO" \
            --json number,headRefName,mergeStateStatus,baseRefName,headRepository \
            --jq "[.[] | select(.baseRefName == \"main\") | select(.headRepository.nameWithOwner == \"$REPO\")]")

          echo "Open same-repo PRs targeting main:"
          echo "$PRS_JSON" | jq -r '.[] | "  #\(.number) [\(.mergeStateStatus)] \(.headRefName)"'

          # Process each PR. Loop over JSON array via index so we can read
          # only env-style fields and never interpolate untrusted data.
          COUNT=$(echo "$PRS_JSON" | jq 'length')
          for i in $(seq 0 $((COUNT - 1))); do
            PR_NUM=$(echo "$PRS_JSON" | jq -r ".[$i].number")
            BRANCH=$(echo "$PRS_JSON" | jq -r ".[$i].headRefName")
            STATUS=$(echo "$PRS_JSON" | jq -r ".[$i].mergeStateStatus")

            # Defensive: branch names are user-controlled. Refuse anything
            # that isn't a sane ref. (`refs/heads/<name>` syntax: letters,
            # digits, slashes, dashes, underscores, dots.)
            if ! printf '%s' "$BRANCH" | grep -qE '^[A-Za-z0-9._/-]+$'; then
              echo "::warning::PR #$PR_NUM has unsafe branch name; skipping"
              continue
            fi

            case "$STATUS" in
              BEHIND)
                echo "PR #$PR_NUM ($BRANCH): clean rebase needed"
                git fetch origin "$BRANCH":"refs/remotes/origin/$BRANCH" --force
                git checkout -B "$BRANCH" "origin/$BRANCH"
                if git rebase origin/main; then
                  if git push --force-with-lease origin "$BRANCH"; then
                    gh pr comment "$PR_NUM" -R "$REPO" \
                      --body "🔁 Auto-rebased on \`main\` (no conflicts) after $MAIN_SHA."
                  else
                    echo "::warning::Force-push of #$PR_NUM failed (lease lost?). Will retry on next push."
                  fi
                else
                  # Race: GitHub said BEHIND but the rebase produced
                  # conflicts. The next push will see DIRTY and route to
                  # the @claude path.
                  git rebase --abort
                  echo "::warning::Rebase of #$PR_NUM failed despite BEHIND status (likely race with another push)"
                fi
                git checkout main
                ;;
              DIRTY)
                echo "PR #$PR_NUM ($BRANCH): conflicts — asking @claude to rebase"
                # Idempotency: don't re-ask claude for the same main SHA.
                MARKER="<!-- autofix-rebase-claude:$MAIN_SHA -->"
                ALREADY=$(gh pr view "$PR_NUM" -R "$REPO" --json comments \
                  --jq "[.comments[] | select(.body | contains(\"$MARKER\"))] | length")
                if [ "$ALREADY" -gt 0 ]; then
                  echo "  already asked @claude for $MAIN_SHA — skipping"
                  continue
                fi
                gh pr comment "$PR_NUM" -R "$REPO" --body "$MARKER
                @claude main has moved and this PR has merge conflicts. Please rebase \`$BRANCH\` on \`origin/main\` and resolve any conflicts. Run the local pre-push gate before force-pushing. If the conflicts indicate the underlying approach is invalidated by the new main, push back via a comment instead of force-fitting a resolution."
                ;;
              CLEAN)
                echo "PR #$PR_NUM ($BRANCH): already current — skipping"
                ;;
              *)
                echo "PR #$PR_NUM ($BRANCH): status $STATUS — leaving alone"
                ;;
            esac
          done
