name: conflict-wake

# GitHub sends no event when a pull request becomes conflicted because its
# base branch moved, so the managed Auto-fix watcher on that PR never wakes
# to resolve it. A comment on the PR does wake it. This workflow posts one,
# once per PR head, when a push leaves an open PR targeting the pushed branch
# unable to merge. The comment is only a wake-up signal: the watcher reads the
# PR's mergeable state itself before it acts. See .github/managed-autofix.md.
#
# The canonical copy is templates/conflict-wake.yml in the
# setup-managed-autofix skill. Every repository keeps this file unchanged;
# change the template and copy it out again.

on:
  push:
    # A tag is never a PR base.
    branches: ['**']

concurrency:
  group: conflict-wake-${{ github.ref }}
  cancel-in-progress: true

permissions:
  pull-requests: write

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      BASE: ${{ github.ref_name }}
    steps:
      - name: Comment on PRs this push left conflicted
        run: |
          set -euo pipefail
          # Only a same-repository PR from a person can have a watcher: opening
          # one takes write access. author_association is not used; it can read
          # CONTRIBUTOR for an org member whose membership is private.
          # The assignment, unlike a `for` word list, fails the job if gh fails.
          prs=$(gh pr list --repo "$REPO" --base "$BASE" --state open --limit 1000 \
                  --json number,isDraft,isCrossRepository,author \
                  --jq '.[] | select((.isDraft | not) and (.isCrossRepository | not) and (.author.is_bot | not)) | .number')

          # GitHub computes `mergeable` in the background after the base moves.
          # Ask for every PR once first, so the later reads find it settled.
          for n in $prs; do
            gh api "repos/$REPO/pulls/$n" --jq .number > /dev/null
          done

          for n in $prs; do
            mergeable=null
            for _ in $(seq 12); do
              read -r mergeable head < <(gh api "repos/$REPO/pulls/$n" --jq '"\(.mergeable) \(.head.sha)"')
              [ "$mergeable" != null ] && break
              sleep 5
            done
            if [ "$mergeable" = null ]; then
              echo "::warning::#$n mergeability did not settle; not checked"
              continue
            fi
            [ "$mergeable" = false ] || continue

            # Read every comment before matching. A failed read then fails the
            # job, and does not look like a missing marker and post a duplicate.
            marker="<!-- base-conflict:$head -->"
            bodies=$(gh api --paginate "repos/$REPO/issues/$n/comments" --jq '.[].body')
            grep -qF "$marker" <<< "$bodies" && continue

            gh api "repos/$REPO/issues/$n/comments" -f body="This PR conflicts with \`$BASE\` as of ${GITHUB_SHA:0:7}.

          $marker" > /dev/null
            echo "Commented on #$n (head ${head:0:7})"
          done
